[package]
name = "poopterm"
version = "0.42.0"
edition = "2024"
license = "MIT"

[dependencies]
winit = "^0.30"
softbuffer = "^0.4"
portable-pty = "^0.9"
vte = "^0.15"
fontdue = "^0.9"
unicode-width = "^0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
