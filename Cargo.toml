[package]
name = "poopterm"
version = "26.10.13"
edition = "2024"
license = "MIT"

[package.metadata.poopterm]
# Versions are YEAR.MONTH.PATCH; each month gets a random codename, patches keep it.
codename = "Giga Fly"

[dependencies]
winit = "^0.30"
softbuffer = "^0.4"
portable-pty = "^0.9"
fontdue = "^0.9"
unicode-width = "^0.2"
miniz_oxide = "^0.9"
# shm_open/mmap and O_NONBLOCK opens for kitty graphics media.
libc = "^0.2"
image = { version = "^0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = { version = "^0.17", default-features = false, features = ["xdg-portal"] }
# Global allocator: the system ones (musl above all) cost throughput.
mimalloc = { version = "^0.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false

# Release optimizations with every compile-time debugging aid: full debug
# info, debug assertions (including the terminal lock's double-lock check),
# overflow checks, and unwinding panics with backtraces. For chasing bugs at
# full speed; the checks change timings, so benchmark with `profiling`.
[profile.debugging]
inherits = "release"
debug = "full"
strip = "none"
debug-assertions = true
overflow-checks = true
panic = "unwind"

# Release exactly, plus symbols, for perf and callgrind.
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"

[dev-dependencies]
# The reference that `vt` and the terminal are tested against.
vte = "^0.15"
