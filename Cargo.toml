[package]
name = "poopterm"
version = "0.43.0"
edition = "2024"
license = "MIT"

[dependencies]
winit = "^0.30"
softbuffer = "^0.4"
portable-pty = "^0.9"
vte = "^0.15"
fontdue = "^0.9"
unicode-width = "^0.2"
image = { version = "^0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = { version = "^0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
