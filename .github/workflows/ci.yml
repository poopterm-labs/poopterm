name: Build, test and release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev

      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal --component rustfmt --component clippy

      - name: Test release tools and PTY benchmark
        run: python3 -m unittest discover -s tests

      - name: Run fmt
        run: cargo +nightly fmt --check

      - name: Run tests
        run: cargo +nightly test --locked

      - name: Run clippy
        run: cargo +nightly clippy --locked --all-targets -- -D warnings

      - name: Check BSD-specific code
        if: runner.os == 'Linux'
        run: |
          rustup +nightly target add x86_64-unknown-freebsd
          cargo +nightly clippy --locked --target x86_64-unknown-freebsd --all-targets -- -D warnings

      - name: Build release binary
        run: cargo +nightly build --release --locked

      - name: Verify binary execution
        run: ./target/release/poopterm --version

  freebsd:
    runs-on: ubuntu-latest
    # Booting the VM and a cold build take ~15 minutes; a hang should not take 6 hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build and test on FreeBSD
        # Third-party: pinned to a commit; Dependabot updates the pin.
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          usesh: true
          prepare: |
            pkg install -y curl pkgconf xorg libxkbcommon wayland bash zsh python311
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
            sh /tmp/rustup.sh -y --default-toolchain nightly --profile minimal --component clippy --component rustfmt
          run: |
            . "$HOME/.cargo/env"
            cargo fmt --check
            cargo test --locked
            cargo clippy --locked --all-targets -- -D warnings
            cargo build --release --locked
            ./target/release/poopterm --version

  release:
    needs: [check, freebsd]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: poopterm-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish the checked main revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/release.sh
